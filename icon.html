<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>7-Eleven Menu</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    .menu-bar {
      display: flex;
      align-items: center;
      padding: 10px;
      background-color: #f8f8f8;
      border-bottom: 1px solid #ddd;
    }

    .menu-logo img {
      height: 50px;
      margin-right: 20px;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 0 15px;
      font-size: 14px;
      color: #333;
      text-decoration: none;
    }

    .menu-item img {
      width: 32px;
      height: 32px;
      margin-bottom: 5px;
    }

    .menu-container {
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="menu-bar">
  <div class="menu-logo">
    <img src="logo7.png" alt="7-Eleven">
  </div>
  <div class="menu-container">
    <a href="#" class="menu-item">
      <img src="icon1.png" alt="All Online">
      <span>All Online</span>
    </a>
    <a href="#" class="menu-item">
      <img src="icon2.png" alt="ร้านเซเว่น">
      <span>ร้านเซเว่น</span>
    </a>
    <a href="#" class="menu-item">
      <img src="icon3.png" alt="โปรโมชั่น">
      <span>โปรโมชั่น</span>
    </a>
    <a href="#" class="menu-item">
      <img src="icon4.png" alt="สินค้า">
      <span>สินค้า</span>
    </a>
    <a href="#" class="menu-item">
      <img src="icon5.png" alt="ออลล์เมมเบอร์">
      <span>ออลล์ เมมเบอร์</span>
    </a>
    <a href="#" class="menu-item">
      <img src="icon6.png" alt="ค้นหาร้าน">
      <span>ค้นหาร้าน</span>
    </a>
  </div>
</div>

</body>
</html>
